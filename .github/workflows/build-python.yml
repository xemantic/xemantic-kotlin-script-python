# Tests with the minimum supported Python and the newest one verified with the pinned jep,
# the test venv created from it
name: Build Python versions

on:
  push:
    branches:
      - main
  pull_request:

# a new push to a pull request cancels its previous run, a push to main gets a group of its own,
# so that it is neither cancelled nor replaced while pending
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test with Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.10', '3.14' ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # also exports JAVA_HOME, which pip needs to build jep, published only as a source distribution
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ vars.DEFAULT_JAVA_DISTRIBUTION }}
          java-version: ${{ vars.DEFAULT_JAVA_VERSION }}

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # only the tests depend on the Python, the rest is built by the shared workflow
      - name: Test
        run: ./gradlew test
        env:
          ORG_GRADLE_PROJECT_basePython: ${{ steps.python.outputs.python-path }}
